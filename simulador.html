<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Óptico - APEX Kinetix</title>
    <link href="https://unpkg.com/tailwindcss@^2/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .text-apex-blue { color: #00529B; }
        .bg-apex-blue { background-color: #00529B; }
        .text-apex-cyan { color: #00A4E4; }
        .bg-apex-cyan { background-color: #00A4E4; }
        .focus-letter { color: #EF4444; font-weight: 900; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200 font-sans min-h-screen flex flex-col">

    <header class="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 h-16 flex items-center justify-between px-6 shrink-0">
        <a href="index.html" class="flex items-center gap-2 text-slate-500 hover:text-apex-blue dark:hover:text-apex-cyan transition-colors">
            <i class="fas fa-arrow-left"></i> <span class="font-bold">Volver a Métricas</span>
        </a>
        <h1 class="text-lg font-black text-apex-blue dark:text-apex-cyan">SIMULADOR ÓPTICO</h1>
        <div class="w-8"></div> <!-- Espaciador para centrar -->
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-4 max-w-3xl mx-auto w-full">
        
        <!-- Área de Lectura -->
        <div class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-8 md:p-12 shadow-lg mb-8 min-h-[200px] flex items-center justify-center text-center relative">
            <div id="word-display" class="text-3xl md:text-5xl font-black tracking-wide transition-all">
                Presiona "Iniciar" para comenzar
            </div>
        </div>

        <!-- Controles -->
        <div class="w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm space-y-6">
            
            <!-- Slider de PPM -->
            <div>
                <div class="flex justify-between mb-2">
                    <span class="text-sm font-bold text-slate-500 uppercase">Velocidad</span>
                    <span class="text-sm font-black text-apex-blue dark:text-apex-cyan"><span id="ppm-display">300</span> PPM</span>
                </div>
                <input type="range" id="ppm-slider" min="100" max="800" step="10" value="300" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-apex-blue">
            </div>

            <!-- Botones -->
            <div class="flex items-center justify-center gap-4">
                <button id="btn-play" class="w-16 h-16 bg-apex-blue text-white rounded-2xl hover:bg-blue-700 shadow-md transition-all flex items-center justify-center text-2xl">
                    <i class="fas fa-play" id="play-icon"></i>
                </button>
                <button id="btn-reset" class="w-12 h-12 bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-300 dark:hover:bg-slate-700 transition-all flex items-center justify-center text-lg">
                    <i class="fas fa-redo"></i>
                </button>
            </div>

            <!-- Barra de Progreso -->
            <div class="w-full bg-slate-200 dark:bg-slate-800 rounded-full h-2 overflow-hidden">
                <div id="progress-bar" class="bg-apex-cyan h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
        </div>

        <!-- Mensaje de Finalización (Oculto por defecto) -->
        <div id="completion-message" class="hidden mt-6 text-center p-4 bg-emerald-100 dark:bg-emerald-900 text-emerald-700 dark:text-emerald-300 rounded-xl font-bold">
            ¡Sesión completada! Progreso guardado automáticamente. 🧠
        </div>
    </main>

    <script>
        // Texto de prueba (puedes cambiar esto por el texto que quieras)
        const textoEjemplo = "La lectura veloz no es un truco es una habilidad biomecánica que se entrena. Tu cerebro puede procesar información mucho más rápido de lo que tus ojos se mueven. El secreto está en eliminar la subvocalización y ampliar tu visión periférica. Cada día que practicas fortaleces tus músculos oculares y tu capacidad de atención. La soberanía mental comienza cuando controlas tu enfoque. Sigue practicando y verás resultados increíbles en tu comprensión lectora.";
        const words = textoEjemplo.split(' ');
        
        let currentIndex = 0;
        let isPlaying = false;
        let timer = null;

        const wordDisplay = document.getElementById('word-display');
        const ppmSlider = document.getElementById('ppm-slider');
        const ppmDisplay = document.getElementById('ppm-display');
        const btnPlay = document.getElementById('btn-play');
        const playIcon = document.getElementById('play-icon');
        const btnReset = document.getElementById('btn-reset');
        const progressBar = document.getElementById('progress-bar');
        const completionMessage = document.getElementById('completion-message');

        // Actualizar valor del slider
        ppmSlider.addEventListener('input', (e) => {
            ppmDisplay.textContent = e.target.value;
            if (isPlaying) {
                pauseReading();
                playReading();
            }
        });

        function render() {
            if (currentIndex >= words.length) {
                pauseReading();
                currentIndex = words.length - 1;
                completarEntrenamiento();
                return;
            }

            const word = words[currentIndex];
            const focusIndex = Math.floor(word.length / 3);
            const part1 = word.substring(0, focusIndex);
            const focusChar = word.charAt(focusIndex);
            const part2 = word.substring(focusIndex + 1);

            wordDisplay.innerHTML = `<span class="text-slate-800 dark:text-slate-200">${part1}</span><span class="focus-letter">${focusChar}</span><span class="text-slate-800 dark:text-slate-200">${part2}</span>`;

            const percent = ((currentIndex + 1) / words.length) * 100;
            progressBar.style.width = `${percent}%`;
        }

        function playReading() {
            if (words.length === 0) return;
            isPlaying = true;
            playIcon.className = "fas fa-pause";
            btnPlay.classList.replace('bg-apex-blue', 'bg-red-500');
            btnPlay.classList.replace('hover:bg-blue-700', 'hover:bg-red-600');

            const ppm = parseInt(ppmSlider.value);
            const interval = 60000 / ppm; // Milisegundos por palabra

            timer = setInterval(() => {
                currentIndex++;
                render();
            }, interval);
        }

        function pauseReading() {
            isPlaying = false;
            clearInterval(timer);
            playIcon.className = "fas fa-play";
            btnPlay.classList.replace('bg-red-500', 'bg-apex-blue');
            btnPlay.classList.replace('hover:bg-red-600', 'hover:bg-blue-700');
        }

        function resetReading() {
            pauseReading();
            currentIndex = 0;
            progressBar.style.width = '0%';
            wordDisplay.textContent = 'Presiona "Iniciar" para comenzar';
            completionMessage.classList.add('hidden');
        }

        function completarEntrenamiento() {
            // GUARDAR PROGRESO EN LOCALSTORAGE
            const ppmActual = parseInt(ppmSlider.value);
            const ppmGuardado = parseInt(localStorage.getItem('apex_ritmo_enfoque') || '200');
            
            // Si el alumno logró una velocidad mayor, la guardamos como nuevo récord
            if (ppmActual > ppmGuardado) {
                localStorage.setItem('apex_ritmo_enfoque', ppmActual);
            }
            
            // Simular retención y aumentar racha (lógica simple para demostración)
            localStorage.setItem('apex_retencion_cognitiva', '85');
            
            let racha = parseInt(localStorage.getItem('apex_focus_streak') || '0');
            localStorage.setItem('apex_focus_streak', racha + 1);

            completionMessage.classList.remove('hidden');
            wordDisplay.innerHTML = '<span class="text-apex-cyan">¡Excelente trabajo!</span>';
        }

        btnPlay.addEventListener('click', () => {
            if (isPlaying) pauseReading();
            else playReading();
        });

        btnReset.addEventListener('click', resetReading);

        // Modo oscuro (sincronizado con index.html)
        if (localStorage.getItem('apex_dark_mode') === 'enabled') {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
